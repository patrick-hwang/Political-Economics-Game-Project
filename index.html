<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decision Flow</title>

  <style>
    :root {
      --context: #B0E0E6;
      --win: #93c572;
      --lose: #FF746C;
      --ink: #1f2937;
      --muted: #64748b;
      --surface: #ffffff;
      --page: #f3f6fa;
      --border: #dbe3ec;
      --accent: #315c9b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 18px;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      width: min(900px, 100%);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 3vw, 1.8rem);
    }

    .toolbar {
      display: flex;
      gap: 8px;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      transition: transform .12s ease,
        border-color .12s ease,
        background .12s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 2px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
      transform: none;
    }

    .secondary {
      background: var(--surface);
      color: var(--ink);
    }

    .primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .screen {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .intro,
    .panel,
    .outcome,
    .status {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: clamp(20px, 4vw, 30px);
      box-shadow: 0 8px 24px rgba(15, 23, 42, .045);
    }

    .intro {
      text-align: center;
      padding-block: 64px;
    }

    .intro p {
      color: var(--muted);
      line-height: 1.65;
      max-width: 560px;
      margin: 12px auto 24px;
    }

    .eyebrow {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .09em;
      font-size: .75rem;
      font-weight: 700;
      margin: 0 0 10px;
    }

    .context {
      background: var(--context);
      border-color: transparent;
    }

    .context p,
    .question p,
    .outcome p {
      margin: 0;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .question {
      background: var(--surface);
    }

    .question h2 {
      font-size: 1rem;
      color: var(--muted);
      margin: 0 0 12px;
    }

    .question p {
      font-size: clamp(1.15rem, 2.5vw, 1.45rem);
      font-weight: 650;
    }

    .context-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .answer {
      min-height: 112px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      text-align: left;
      gap: 12px;
      padding: 20px;
      background: white;
      border: 2px solid var(--border);
      border-radius: 16px;
      color: var(--ink);
      line-height: 1.5;
      font-weight: 600;
    }

    .answer:hover {
      border-color: var(--accent);
      background: #f8fbff;
    }

    .answer-index {
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #e8eef7;
      color: var(--accent);
      font-weight: 750;
    }

    .outcome.win {
      background: color-mix(in srgb, var(--win) 35%, white);
      border-color: var(--win);
    }

    .outcome.lose {
      background: color-mix(in srgb, var(--lose) 22%, white);
      border-color: var(--lose);
    }

    .outcome h2 {
      margin: 0 0 12px;
    }

    .status {
      color: #9f1239;
      border-color: #fecdd3;
      background: #fff1f2;
    }

    .meta {
      color: var(--muted);
      font-size: .85rem;
      margin-top: 4px;
    }

    /* Confirmation modal */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal {
      width: min(600px, 100%);
      max-height: 85vh;
      overflow-y: auto;
      background: white;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .2);
      animation: modalAppear .2s ease;
    }

    @keyframes modalAppear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal h2 {
      margin: 0 0 8px;
      font-size: 1.4rem;
    }

    .modal-subtitle {
      color: var(--muted);
      font-size: .85rem;
      margin-bottom: 20px;
    }

    .modal-choice {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 16px;
      border-radius: 12px;
      font-weight: 650;
      line-height: 1.5;
      margin-bottom: 20px;
      white-space: pre-wrap;
    }

    .modal-section {
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 14px;
    }

    .modal-section h3 {
      margin: 0 0 10px;
      font-size: 1rem;
    }

    .modal-section p,
    .modal-section li {
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .modal-section ul {
      padding-left: 22px;
      margin: 0;
    }

    .modal-section li+li {
      margin-top: 6px;
    }

    .modal-benefit {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
    }

    .modal-drawback {
      background: #fff1f2;
      border: 1px solid #fecdd3;
    }

    .modal-confirmation {
      font-weight: 650;
      margin: 22px 0 16px;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    @media (max-width: 620px) {
      body {
        padding: 20px 12px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .answers {
        grid-template-columns: 1fr;
      }

      .answer {
        min-height: 78px;
      }

      .toolbar {
        flex-wrap: wrap;
      }

      .toolbar button {
        padding: 9px 11px;
      }
    }

    @media (max-width: 500px) {
      .modal {
        padding: 20px;
      }

      .modal-actions {
        flex-direction: column;
      }

      .modal-actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header>
      <div>
        <h1>Decision Flow</h1>
        <div class="meta" id="progress">Loading questions...</div>
      </div>

      <nav class="toolbar" aria-label="Navigation">
        <button class="secondary" id="backButton" type="button" disabled>
          Back
        </button>

        <button class="secondary" id="restartButton" type="button">
          Restart
        </button>

        <button class="secondary" id="reloadButton" type="button">
          Reload JSON
        </button>
      </nav>
    </header>

    <section id="screen" class="screen" aria-live="polite">
      <div class="intro">
        <p class="eyebrow">Interactive story</p>
        <h2>Make your first decision</h2>
        <p>Loading your decision flow...</p>
      </div>
    </section>

  </main>

  <script>

    // ============================================
    // CONFIGURATION
    // ============================================

    const DATA_URL = "questions_v3.json";
    const START_NODE_ID = 1;


    // ============================================
    // APPLICATION STATE
    // ============================================

    let nodes = new Map();

    // Stores previously visited screens.
    let history = [];

    // Currently displayed question/outcome.
    let currentScreen = null;

    // Choice waiting for confirmation.
    let pendingChoice = null;

    let isLoading = false;


    // ============================================
    // DOM REFERENCES
    // ============================================

    const screenElement = document.getElementById("screen");
    const progressElement = document.getElementById("progress");

    const backButton = document.getElementById("backButton");
    const restartButton = document.getElementById("restartButton");
    const reloadButton = document.getElementById("reloadButton");


    // ============================================
    // HELPER FUNCTIONS
    // ============================================

    function makeElement(tag, className, text) {

      const element = document.createElement(tag);

      if (className) {
        element.className = className;
      }

      if (text !== undefined) {
        element.textContent = text;
      }

      return element;
    }


    function setNavigationState() {

      backButton.disabled =
        history.length === 0 || isLoading;

      restartButton.disabled = isLoading;
      reloadButton.disabled = isLoading;

    }


    // ============================================
    // JSON LOADING
    // ============================================

    async function loadNodes() {

      const response = await fetch(
        `${DATA_URL}?t=${Date.now()}`
      );

      if (!response.ok) {
        throw new Error(
          `Could not load ${DATA_URL} (HTTP ${response.status}).`
        );
      }

      const data = await response.json();

      if (!Array.isArray(data)) {
        throw new Error(
          "The JSON root must be an array of nodes."
        );
      }

      const newNodes = new Map(
        data.map(node => [Number(node.node), node])
      );

      if (newNodes.size !== data.length) {
        throw new Error(
          "The JSON contains duplicate node IDs."
        );
      }

      nodes = newNodes;

      console.log("JSON loaded successfully.");

    }


    // ============================================
    // START SCREEN
    // ============================================

    function showStart() {

      closeChoiceModal();

      history = [];
      currentScreen = null;

      progressElement.textContent = "Ready to begin";

      screenElement.replaceChildren();

      const intro = makeElement("div", "intro");

      intro.append(
        makeElement("p", "eyebrow", "Interactive story"),
        makeElement("h2", "", "Make your first decision"),
        makeElement(
          "p",
          "",
          "Start the scenario. Each choice will take you to the next context, question, and available answers."
        )
      );

      const button = makeElement(
        "button",
        "primary",
        "Start"
      );

      button.type = "button";
      button.disabled = isLoading;

      button.addEventListener("click", startFlow);

      intro.append(button);
      screenElement.append(intro);

      setNavigationState();

    }


    // ============================================
    // RESOLVE NODE FLOW
    // ============================================

    /*
      Starting from a node ID:

      1. Collect context nodes.
      2. Stop when a question node is found.
      3. Retrieve its two choice nodes.
      4. Or stop when a win/lose node is found.
    */

    function resolveScreen(startNodeId) {

      const contexts = [];
      const visited = new Set();

      let nodeId = Number(startNodeId);

      while (true) {

        if (visited.has(nodeId)) {
          throw new Error(
            `A cycle was detected at node ${nodeId}.`
          );
        }

        visited.add(nodeId);

        const node = nodes.get(nodeId);

        if (!node) {
          throw new Error(
            `Node ${nodeId} was not found in the JSON file.`
          );
        }


        // ----------------------------------------
        // CONTEXT NODE
        // ----------------------------------------

        if (node.type === "context") {

          contexts.push(node);

          const next = node["next node"] || [];

          if (next.length !== 1) {
            throw new Error(
              `Context node ${nodeId} should link to exactly one next node.`
            );
          }

          nodeId = Number(next[0]);

          continue;
        }


        // ----------------------------------------
        // QUESTION NODE
        // ----------------------------------------

        if (node.type === "question") {

          const next = node["next node"] || [];

          if (next.length !== 2) {
            throw new Error(
              `Question node ${nodeId} should have exactly two choices.`
            );
          }

          const choices = next.map(id => {

            const choice = nodes.get(Number(id));

            if (!choice || choice.type !== "choice") {
              throw new Error(
                `Question ${nodeId} points to node ${id}, which is not a choice node.`
              );
            }

            return choice;

          });

          return {
            contexts,
            question: node,
            choices
          };

        }


        // ----------------------------------------
        // OUTCOME NODE
        // ----------------------------------------

        if (node.type === "win" || node.type === "lose") {

          return {
            contexts,
            outcome: node
          };

        }


        throw new Error(
          `Unexpected node type "${node.type}" at node ${nodeId}.`
        );

      }

    }


    // ============================================
    // RENDER SCREEN
    // ============================================

    function renderScreen(view, pushHistory = true) {

      if (pushHistory && currentScreen) {
        history.push(currentScreen);
      }

      currentScreen = view;

      screenElement.replaceChildren();

      setNavigationState();


      // ----------------------------------------
      // WIN / LOSE SCREEN
      // ----------------------------------------

      if (view.outcome) {

        progressElement.textContent =
          view.outcome.type === "win"
            ? "Scenario completed"
            : "Scenario ended";

        const outcome = makeElement(
          "article",
          `outcome ${view.outcome.type}`
        );

        outcome.append(
          makeElement(
            "p",
            "eyebrow",
            view.outcome.type === "win"
              ? "Winning outcome"
              : "Losing outcome"
          ),

          makeElement(
            "h2",
            "",
            view.outcome.type === "win"
              ? "You win"
              : "You lose"
          ),

          makeElement(
            "p",
            "",
            view.outcome.content || "The scenario has ended."
          ),

          makeElement(
            "p",
            "meta",
            `Node ID: ${view.outcome.node}`
          )
        );

        screenElement.append(
          ...view.contexts.map(createContextCard),
          outcome
        );

        return;
      }


      // ----------------------------------------
      // QUESTION SCREEN
      // ----------------------------------------

      progressElement.textContent =
        `Question node ${view.question.node}`;


      // Context cards.

      const contextStack = makeElement(
        "div",
        "context-stack"
      );

      view.contexts.forEach(context => {
        contextStack.append(
          createContextCard(context)
        );
      });


      // Question card.

      const questionCard = makeElement(
        "article",
        "panel question"
      );

      questionCard.append(
        makeElement(
          "h2",
          "",
          `Question ${view.question.node}`
        ),

        makeElement(
          "p",
          "",
          view.question.content
        )
      );


      // Answer buttons.

      const answers = makeElement(
        "div",
        "answers"
      );

      view.choices.forEach((choice, index) => {

        const button = makeElement(
          "button",
          "answer"
        );

        button.type = "button";

        const number = makeElement(
          "span",
          "answer-index",
          String(index + 1)
        );

        const label = makeElement(
          "span",
          "",
          choice.content
        );

        const choiceId = makeElement(
          "span",
          "meta",
          `Choice node ${choice.node}`
        );

        const answerContent = makeElement("div");

        answerContent.style.display = "flex";
        answerContent.style.flexDirection = "column";
        answerContent.style.gap = "4px";

        answerContent.append(label, choiceId);

        button.append(number, answerContent);

        // IMPORTANT:
        // Clicking an answer opens the confirmation popup.
        // It does NOT immediately navigate to the next node.

        button.addEventListener("click", () => {
          selectChoice(choice);
        });

        answers.append(button);

      });


      screenElement.append(
        contextStack,
        questionCard,
        answers
      );

    }


    // ============================================
    // CONTEXT CARD
    // ============================================

    function createContextCard(context) {

      const card = makeElement(
        "article",
        "panel context"
      );

      card.append(
        makeElement(
          "p",
          "eyebrow",
          `Context ${context.node}`
        ),

        makeElement(
          "p",
          "",
          context.content
        )
      );

      return card;

    }


    // ============================================
    // START FLOW
    // ============================================

    function startFlow() {

      if (isLoading) return;

      try {

        const startNode = nodes.get(START_NODE_ID);

        if (!startNode) {
          throw new Error(
            `Start node ${START_NODE_ID} was not found.`
          );
        }

        const next = startNode["next node"] || [];

        if (next.length !== 1) {
          throw new Error(
            "The Start node must link to exactly one next node."
          );
        }

        history = [];

        renderScreen(
          resolveScreen(next[0]),
          false
        );

      } catch (error) {

        showError(error);

      }

    }


    // ============================================
    // CHOICE SELECTION
    // ============================================

    function selectChoice(choice) {

      // Prevent another selection while a popup is open.
      if (pendingChoice) return;

      // Store the selected choice temporarily.
      pendingChoice = choice;

      showChoiceModal(choice);

    }


    // ============================================
    // CREATE BENEFIT / DRAWBACK SECTION
    // ============================================

    function createDetailSection(
      title,
      content,
      className
    ) {

      const section = makeElement(
        "section",
        `modal-section ${className}`
      );

      section.append(
        makeElement("h3", "", title)
      );

      // Handle empty, null or missing values.
      if (
        content === null ||
        content === undefined ||
        content === ""
      ) {

        section.append(
          makeElement(
            "p",
            "",
            "No information provided."
          )
        );

        return section;
      }


      // Support both string and array formats.
      let items;

      if (Array.isArray(content)) {

        items = content;

      } else {

        items = String(content)
          .split("\n")
          .map(item => item.trim())
          .filter(item => item.length > 0);

      }


      if (items.length === 0) {

        section.append(
          makeElement(
            "p",
            "",
            "No information provided."
          )
        );

        return section;

      }


      const list = makeElement("ul");

      items.forEach(item => {

        list.append(
          makeElement(
            "li",
            "",
            String(item)
          )
        );

      });

      section.append(list);

      return section;

    }


    // ============================================
    // CONFIRMATION POPUP
    // ============================================

    function showChoiceModal(choice) {

      const overlay = makeElement(
        "div",
        "modal-overlay"
      );

      overlay.id = "choiceModal";

      const modal = makeElement(
        "div",
        "modal"
      );

      modal.setAttribute("role", "dialog");
      modal.setAttribute("aria-modal", "true");
      modal.setAttribute(
        "aria-labelledby",
        "modalTitle"
      );


      // ----------------------------------------
      // MODAL HEADER
      // ----------------------------------------

      const heading = makeElement(
        "h2",
        "",
        "Review Your Decision"
      );

      heading.id = "modalTitle";

      const subtitle = makeElement(
        "p",
        "modal-subtitle",
        `Choice node ${choice.node}`
      );


      // ----------------------------------------
      // SELECTED CHOICE
      // ----------------------------------------

      const selectedChoice = makeElement(
        "div",
        "modal-choice",
        choice.content || "No choice description provided."
      );


      // ----------------------------------------
      // BENEFITS
      // ----------------------------------------

      const benefitSection = createDetailSection(
        "Benefits",
        choice.benefits,
        "modal-benefit"
      );


      // ----------------------------------------
      // POTENTIAL DRAWBACKS
      // ----------------------------------------

      const drawbackSection = createDetailSection(
        "Potential Drawbacks",
        choice["potential drawback"],
        "modal-drawback"
      );


      // ----------------------------------------
      // CONFIRMATION QUESTION
      // ----------------------------------------

      const confirmation = makeElement(
        "p",
        "modal-confirmation",
        "Do you want to confirm this choice and continue to the next question?"
      );


      // ----------------------------------------
      // BUTTONS
      // ----------------------------------------

      const actions = makeElement(
        "div",
        "modal-actions"
      );


      // Cancel button.

      const cancelButton = makeElement(
        "button",
        "secondary",
        "No, go back"
      );

      cancelButton.type = "button";

      cancelButton.addEventListener(
        "click",
        closeChoiceModal
      );


      // Confirm button.

      const confirmButton = makeElement(
        "button",
        "primary",
        "Yes, confirm"
      );

      confirmButton.type = "button";

      confirmButton.addEventListener("click", () => {

        // Get the selected choice.
        const confirmedChoice = pendingChoice;

        if (!confirmedChoice) return;

        // Close popup and clear pending selection.
        closeChoiceModal();

        // Only now navigate to the next node.
        proceedWithChoice(confirmedChoice);

      });


      actions.append(
        cancelButton,
        confirmButton
      );


      // ----------------------------------------
      // BUILD MODAL
      // ----------------------------------------

      modal.append(
        heading,
        subtitle,
        selectedChoice,
        benefitSection,
        drawbackSection,
        confirmation,
        actions
      );

      overlay.append(modal);

      document.body.append(overlay);

      cancelButton.focus();

    }


    // ============================================
    // CLOSE CONFIRMATION POPUP
    // ============================================

    function closeChoiceModal() {

      const overlay = document.getElementById(
        "choiceModal"
      );

      if (overlay) {
        overlay.remove();
      }

      // Clear the unconfirmed answer.
      pendingChoice = null;

    }


    // ============================================
    // PROCEED AFTER CONFIRMATION
    // ============================================

    function proceedWithChoice(choice) {

      try {

        const next = choice["next node"] || [];

        if (next.length !== 1) {
          throw new Error(
            `Choice node ${choice.node} should link to exactly one next node.`
          );
        }

        // Navigate to the next node only after confirmation.
        const nextScreen = resolveScreen(next[0]);

        renderScreen(nextScreen);

      } catch (error) {

        showError(error);

      }

    }


    // ============================================
    // ERROR HANDLING
    // ============================================

    function showError(error) {

      closeChoiceModal();

      screenElement.replaceChildren();

      screenElement.append(
        makeElement(
          "div",
          "status",
          `Unable to display this part of the flow: ${error.message}`
        )
      );

      progressElement.textContent = "Flow error";

      setNavigationState();

      console.error(error);

    }


    // ============================================
    // BACK BUTTON
    // ============================================

    backButton.addEventListener("click", () => {

      if (isLoading) return;

      // Close any pending popup.
      closeChoiceModal();

      if (!history.length) return;

      // Restore the previous screen.
      currentScreen = history.pop();

      renderScreen(
        currentScreen,
        false
      );

    });


    // ============================================
    // RESTART BUTTON
    // ============================================

    restartButton.addEventListener("click", () => {

      if (isLoading) return;

      showStart();

    });


    // ============================================
    // RELOAD JSON BUTTON
    // ============================================

    reloadButton.addEventListener("click", async () => {

      if (isLoading) return;

      isLoading = true;

      closeChoiceModal();

      setNavigationState();

      progressElement.textContent = "Reloading JSON...";

      try {

        await loadNodes();

        // Reset the flow after loading updated JSON.
        showStart();

        progressElement.textContent =
          "JSON reloaded successfully. Ready to begin.";

      } catch (error) {

        showError(error);

      } finally {

        isLoading = false;

        setNavigationState();

      }

    });


    // ============================================
    // INITIALIZE APPLICATION
    // ============================================

    async function initialize() {

      isLoading = true;

      setNavigationState();

      try {

        await loadNodes();

        showStart();

        console.log(
          `Loaded ${nodes.size} nodes successfully.`
        );

      } catch (error) {

        showError(error);

      } finally {

        isLoading = false;

        setNavigationState();

      }

    }


    // Start application.
    initialize();

  </script>
