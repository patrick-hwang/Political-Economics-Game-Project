<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decision Flow</title>
  <style>
    :root {
      --context: #B0E0E6;
      --win: #93c572;
      --lose: #FF746C;
      --ink: #1f2937;
      --muted: #64748b;
      --surface: #ffffff;
      --page: #f3f6fa;
      --border: #dbe3ec;
      --accent: #315c9b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 18px;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      width: min(900px, 100%);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 3vw, 1.8rem);
    }

    .toolbar {
      display: flex;
      gap: 8px;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 2px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
      transform: none;
    }

    .secondary {
      background: var(--surface);
      color: var(--ink);
    }

    .primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .screen {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .intro,
    .panel,
    .outcome,
    .status {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: clamp(20px, 4vw, 30px);
      box-shadow: 0 8px 24px rgba(15, 23, 42, .045);
    }

    .intro {
      text-align: center;
      padding-block: 64px;
    }

    .intro p {
      color: var(--muted);
      line-height: 1.65;
      max-width: 560px;
      margin: 12px auto 24px;
    }

    .eyebrow {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .09em;
      font-size: .75rem;
      font-weight: 700;
      margin: 0 0 10px;
    }

    .context {
      background: var(--context);
      border-color: transparent;
    }

    .context p,
    .question p,
    .outcome p {
      margin: 0;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .question {
      background: var(--surface);
    }

    .question h2 {
      font-size: 1rem;
      color: var(--muted);
      margin: 0 0 12px;
    }

    .question p {
      font-size: clamp(1.15rem, 2.5vw, 1.45rem);
      font-weight: 650;
    }

    .context-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .answer {
      min-height: 112px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      text-align: left;
      gap: 12px;
      padding: 20px;
      background: white;
      border: 2px solid var(--border);
      border-radius: 16px;
      color: var(--ink);
      line-height: 1.5;
      font-weight: 600;
    }

    .answer:hover {
      border-color: var(--accent);
      background: #f8fbff;
    }

    .answer-index {
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #e8eef7;
      color: var(--accent);
      font-weight: 750;
    }

    .outcome.win {
      background: color-mix(in srgb, var(--win) 35%, white);
      border-color: var(--win);
    }

    .outcome.lose {
      background: color-mix(in srgb, var(--lose) 22%, white);
      border-color: var(--lose);
    }

    .outcome h2 {
      margin: 0 0 12px;
    }

    .status {
      color: #9f1239;
      border-color: #fecdd3;
      background: #fff1f2;
    }

    .meta {
      color: var(--muted);
      font-size: .85rem;
      margin-top: 4px;
    }

    @media (max-width: 620px) {
      body {
        padding: 20px 12px;
      }

      header {
        align-items: flex-start;
      }

      .answers {
        grid-template-columns: 1fr;
      }

      .answer {
        min-height: 78px;
      }

      .toolbar button {
        padding: 9px 11px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div>
        <h1>Decision Flow</h1>
        <div class="meta" id="progress">Ready to begin</div>
      </div>
      <nav class="toolbar" aria-label="Navigation">
        <button class="secondary" id="backButton" type="button" disabled>Back</button>
        <button class="secondary" id="restartButton" type="button">Restart</button>
        <button class="secondary" id="reloadButton" type="button">Reload JSON</button>
      </nav>
    </header>
    <section id="screen" class="screen" aria-live="polite">
      <div class="intro">
        <p class="eyebrow">Interactive story</p>
        <h2>Make your first decision</h2>
        <p>Start the scenario. Each choice will take you to the next context, question, and available answers.</p>
        <button class="primary" id="startButton" type="button">Start</button>
      </div>
    </section>
  </main>

  <script>
    // The JSON remains in a separate file and is loaded when the page starts.
    const DATA_URL = "questions_v3.json";
    const START_NODE_ID = 1;

    let nodes = new Map();
    let history = [];
    let currentScreen = null;

    const screenElement = document.getElementById("screen");
    const progressElement = document.getElementById("progress");
    const backButton = document.getElementById("backButton");
    const restartButton = document.getElementById("restartButton");
    const startButton = document.getElementById("startButton");
    const reloadButton = document.getElementById("reloadButton");

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function setNavigationState() {
      backButton.disabled = history.length === 0;
    }

    function showStart() {
      currentScreen = null;
      history = [];
      progressElement.textContent = "Ready to begin";
      screenElement.replaceChildren();
      const intro = makeElement("div", "intro");
      intro.append(
        makeElement("p", "eyebrow", "Interactive story"),
        makeElement("h2", "", "Make your first decision"),
        makeElement("p", "", "Start the scenario. Each choice will take you to the next context, question, and available answers.")
      );
      const button = makeElement("button", "primary", "Start");
      button.type = "button";
      button.addEventListener("click", startFlow);
      intro.append(button);
      screenElement.append(intro);
      setNavigationState();
    }
    async function loadNodes() {
      try {
        const response = await fetch(
          `questions_v3.json?t=${Date.now()}`
        );

        if (!response.ok) {
          throw new Error("Failed to load JSON");
        }

        nodes = await response.json();

        console.log("JSON reloaded successfully");

      } catch (error) {
        console.error("Error loading JSON:", error);
      }
    }
    // Follow a path through context nodes until a question or ending is reached.
    function resolveScreen(startNodeId) {
      const contexts = [];
      const visited = new Set();
      let nodeId = startNodeId;

      while (true) {
        if (visited.has(nodeId)) throw new Error(`A cycle was detected at node ${nodeId}.`);
        visited.add(nodeId);
        const node = nodes.get(nodeId);
        if (!node) throw new Error(`Node ${nodeId} was not found in the JSON file.`);

        if (node.type === "context") {
          contexts.push(node);
          const next = node["next node"] || [];
          if (next.length !== 1) throw new Error(`Context node ${nodeId} should link to exactly one next node.`);
          nodeId = next[0];
          continue;
        }

        if (node.type === "question") {
          const next = node["next node"] || [];
          if (next.length !== 2) throw new Error(`Question node ${nodeId} should have exactly two choices.`);
          const choices = next.map(id => {
            const choice = nodes.get(id);
            if (!choice || choice.type !== "choice") {
              throw new Error(`Question ${nodeId} points to node ${id}, which is not a choice node.`);
            }
            return choice;
          });
          return { contexts, question: node, choices };
        }

        if (node.type === "win" || node.type === "lose") {
          return { contexts, outcome: node };
        }

        throw new Error(`Unexpected node type "${node.type}" at node ${nodeId}.`);
      }
    }

    function renderScreen(view, pushHistory = true) {
      if (pushHistory && currentScreen) history.push(currentScreen);
      currentScreen = view;
      screenElement.replaceChildren();
      setNavigationState();

      if (view.outcome) {
        progressElement.textContent = view.outcome.type === "win" ? "Scenario completed" : "Scenario ended";
        const outcome = makeElement("article", `outcome ${view.outcome.type}`);
        outcome.append(
          makeElement(
            "p",
            "eyebrow",
            view.outcome.type === "win" ? "Winning outcome" : "Losing outcome"
          ),
          makeElement(
            "h2",
            "",
            view.outcome.type === "win" ? "You win" : "You lose"
          ),
          makeElement("p", "", view.outcome.content || "The scenario has ended."),
          makeElement("p", "meta", `Node ID: ${view.outcome.node}`)
        );
        screenElement.append(...view.contexts.map(createContextCard), outcome);
        return;
      }

      progressElement.textContent = `Question node ${view.question.node}`;
      const contextStack = makeElement("div", "context-stack");
      view.contexts.forEach(context => contextStack.append(createContextCard(context)));
      const questionCard = makeElement("article", "panel question");
      questionCard.append(
        makeElement("h2", "", `Question ${view.question.node}`),
        makeElement("p", "", view.question.content)
      );
      const answers = makeElement("div", "answers");
      view.choices.forEach((choice, index) => {
        const button = makeElement("button", "answer");
        button.type = "button";
        const number = makeElement("span", "answer-index", String(index + 1));
        const label = makeElement("span", "", choice.content);

        const choiceId = makeElement(
          "span",
          "meta",
          `Choice node ${choice.node}`
        );

        const answerContent = makeElement("div", "");
        answerContent.style.display = "flex";
        answerContent.style.flexDirection = "column";
        answerContent.style.gap = "4px";

        answerContent.append(label, choiceId);
        button.append(number, answerContent);
        button.addEventListener("click", () => selectChoice(choice));
        answers.append(button);
      });
      screenElement.append(contextStack, questionCard, answers);
    }

    function createContextCard(context) {
      const card = makeElement("article", "panel context");
      card.append(
        makeElement("p", "eyebrow", `Context ${context.node}`),
        makeElement("p", "", context.content)
      );
      return card;
    }

    function startFlow() {
      try {
        // Node 1 is the Start marker. Its next node begins the first story context.
        const startNode = nodes.get(START_NODE_ID);
        if (!startNode) throw new Error(`Start node ${START_NODE_ID} was not found.`);
        const next = startNode["next node"] || [];
        if (next.length !== 1) throw new Error("The Start node must link to exactly one next node.");
        renderScreen(resolveScreen(next[0]), false);
      } catch (error) {
        showError(error);
      }
    }

    function selectChoice(choice) {
      try {
        const next = choice["next node"] || [];
        if (next.length !== 1) throw new Error(`Choice node ${choice.node} should link to exactly one next node.`);
        renderScreen(resolveScreen(next[0]));
      } catch (error) {
        showError(error);
      }
    }

    function showError(error) {
      screenElement.replaceChildren();
      screenElement.append(makeElement("div", "status", `Unable to display this part of the flow: ${error.message}`));
      progressElement.textContent = "Flow error";
    }

    async function loadNodes() {
      try {
        const response = await fetch(DATA_URL);
        if (!response.ok) throw new Error(`Could not load ${DATA_URL} (HTTP ${response.status}).`);
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error("The JSON root must be an array of nodes.");
        nodes = new Map(data.map(node => [Number(node.node), node]));
        if (nodes.size !== data.length) throw new Error("The JSON contains duplicate node IDs.");
        startButton.disabled = false;
        startButton.addEventListener("click", startFlow);
      } catch (error) {
        startButton.disabled = true;
        showError(error);
      }
    }

    backButton.addEventListener("click", () => {
      if (!history.length) return;
      currentScreen = history.pop();
      renderScreen(currentScreen, false);
    });
    restartButton.addEventListener("click", showStart);
    startButton.disabled = true;
    loadNodes();
    reloadButton?.addEventListener("click", async () => {
      try {
        await loadNodes();
        showStart();
      } catch (error) {
        showError(error);
      }
    });
  </script>
</body>

</html>
